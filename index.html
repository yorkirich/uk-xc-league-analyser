<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK XC League – standings over time</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb;--panel:#f3f2ef;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;
  --grid:#e8e7e3;--axis:#c9c8c3;--neutral:#c4c3bd;--accent:#2a78d6;--err-bg:#fde8e8;--err-text:#7a1d1d;
  --tile:#3557b7;--tow:#2e8b3d;--declared:#ffd43b;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --surface:#1a1a19;--panel:#242423;--text:#f0efec;--text2:#c3c2b7;--muted:#8e8d86;
  --grid:#2c2c2a;--axis:#4a4a47;--neutral:#4f4f4b;--accent:#3987e5;--err-bg:#3a1a1a;--err-text:#f3b4b4;
  --tile:#4a6fd0;--tow:#3a9c4a;--declared:#ffd84d;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 2px;font-weight:650}
.sub{color:var(--text2);margin:0 0 14px}
.err{background:var(--err-bg);color:var(--err-text);padding:8px 12px;border-radius:8px;margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--panel);padding:12px 14px;border-radius:10px;margin-bottom:12px}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl>label,.lbl{font-size:12px;color:var(--text2)}
.row{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 11px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--surface)}
input,select,.btn{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--axis);border-radius:7px;padding:5px 8px}
.btn{cursor:pointer}
input[type=number]{width:70px}
input[type=range]{padding:0;width:220px;accent-color:var(--accent)}
.search{width:220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--axis);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{border:0;background:transparent;color:var(--text2);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.key{display:inline-block;vertical-align:middle}
#chartWrap{position:relative}
#chart svg{display:block;width:100%}
#chart text{fill:var(--text2);font-size:11px}
#chart text.seglbl{fill:#fff;font-size:10px;font-weight:600;pointer-events:none}
#chart a rect{cursor:pointer}
#chart a:hover rect,#chart a:focus rect{filter:brightness(1.12)}
#chart a:focus{outline:none}
#chart a:focus rect{stroke:var(--text);stroke-width:2}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:190px;max-width:300px;display:none;z-index:2}
#tip .d{font-weight:600;margin-bottom:4px}
#tip .r{display:flex;gap:8px;align-items:center;white-space:nowrap}
#tip .r .n{flex:1;overflow:hidden;text-overflow:ellipsis}
#tip .r .v{font-variant-numeric:tabular-nums;color:var(--text2)}
#tip .m{color:var(--text2)}
.legend{font-size:12px;margin:0 0 8px}
.legend .m{color:var(--muted)}
.ps-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.ps-head .m{font-size:12px}
.ps-row{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-bottom:8px}
.ps-total{display:inline-flex;gap:6px;align-items:baseline;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;padding:4px 10px 4px 0;margin-right:4px;border-right:1px solid var(--grid)}
.ps-total .m{font-size:11px;font-weight:400}
.fc{display:inline-flex;border-radius:6px;background:var(--panel);border-left:4px solid var(--c);font-variant-numeric:tabular-nums}
.fc>a,.fc>.ti{display:inline-flex}
.fc a,.fc{color:var(--text);text-decoration:none}
.fc a{display:inline-flex;gap:6px;align-items:center;padding:4px 10px 4px 8px;border-radius:0 6px 6px 0}
.fc a:hover{background:var(--grid)}
.fc a:hover .sc{text-decoration:underline}
.fc button{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px 4px 8px;border:0;border-radius:0 6px 6px 0;background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.fc button:hover{background:var(--grid)}
.fc button:hover .sc{text-decoration:underline}
#chart rect.cseg,#chart circle.cseg{cursor:pointer}
#chart rect.cseg:hover{filter:brightness(1.12)}
.fc .sc{font-size:13px;font-weight:550}
.ti{flex:none;display:block}
.ps-keys{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;color:var(--text2)}
.ps-keys .lg{display:inline-flex;gap:5px;align-items:center}
#chart .series{cursor:pointer;transition:opacity .12s}
#chart .hitline{pointer-events:stroke}
#chart.hl .series{opacity:.2}
#chart.hl .series.on{opacity:1}
#chart .series.on .vis{stroke-width:3.5}
.lineLegend{display:flex;flex-wrap:wrap;gap:2px 4px;margin:8px 0 4px}
.li{border:1px solid transparent;background:none;color:var(--text);font:inherit;font-size:12.5px;padding:3px 9px 3px 7px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.li:hover{background:var(--panel)}
.li .rk{color:var(--text2);font-variant-numeric:tabular-nums}
.li[aria-pressed=true]{border-color:var(--text);font-weight:600}
.lineLegend.hl .li:not(.on){opacity:.4}
#rows tr.on{background:var(--panel)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 4px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:14px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--grid)}
th{color:var(--text2);font-weight:550;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel)}
.x{border:0;background:transparent;color:var(--text2);cursor:pointer;font-size:15px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="h1">UK XC League — standings through the season</h1>
  <p class="sub" id="sub">Rank or league score for each pilot, day by day.</p>
  <div class="err" id="err" hidden></div>

  <div class="controls">
    <div class="ctl"><label for="season">Season</label><select id="season"></select></div>
    <div class="ctl"><span class="lbl">Standings</span>
      <div class="seg" id="std"><button data-v="pilots">Pilots</button><button data-v="clubs">Clubs</button></div>
    </div>
    <div class="ctl"><span class="lbl">Show</span>
      <div class="seg" id="mode">
        <button data-v="top">Top N</button><button data-v="pick">Chosen <span class="noun">pilots</span></button><button data-v="around">Around a <span class="noun1">pilot</span></button><button data-v="club" data-std="pilots">Club</button>
      </div>
    </div>
    <div class="ctl" data-for="top club"><label for="n">How many</label><input id="n" type="number" min="1" max="100" value="10"></div>
    <div class="ctl" data-for="club"><label for="club">Club</label><select id="club"></select></div>
    <div class="ctl" data-for="pick around"><label for="search" class="noun1 cap">Pilot</label><input id="search" class="search" list="names" placeholder="Type a name…" autocomplete="off"></div>
    <div class="ctl" data-for="around"><label for="k">Places either side</label><input id="k" type="number" min="1" max="30" value="4"></div>
    <div class="ctl"><label for="at">Ranked at <strong id="atLbl"></strong></label><input id="at" type="range" min="0" max="0"></div>
  </div>
  <div class="controls">
    <div class="ctl"><span class="lbl">View</span>
      <div class="seg" id="chartType"><button data-v="line">Compare</button><button data-v="bar">Breakdown</button></div>
    </div>
    <div class="ctl" data-chart="line"><span class="lbl">Plot</span>
      <div class="seg" id="metric"><button data-v="rank">Rank</button><button data-v="score">Score</button></div>
    </div>
    <div class="ctl" data-chart="bar"><label for="barPilot" class="noun1 cap">Pilot</label><select id="barPilot"></select></div>
    <div class="ctl" data-chart="bar"><span class="lbl">Show</span>
      <div class="seg" id="barFlights"><button data-v="all">All</button><button data-v="scoring">Scoring</button><button data-v="best">Best</button></div>
    </div>
    <div class="ctl" data-chart="bar"><span class="lbl">Time scale</span>
      <div class="seg" id="barScale"><button data-v="compact">Compact</button><button data-v="calendar">Calendar</button></div>
    </div>
    <div class="ctl"><span class="lbl">Period</span>
      <div class="row">
        <input id="from" type="date" aria-label="From date"><span class="lbl">to</span><input id="to" type="date" aria-label="To date">
        <button class="btn" id="resetRange">Reset</button>
      </div>
    </div>
  </div>
  <datalist id="names"></datalist>
  <div class="chips" id="chips"></div>

  <div id="barLegend" class="legend" hidden></div>
  <div id="chartWrap"><div id="chart"></div><div id="tip"></div></div>
  <div id="lineLegend" class="lineLegend" data-chart="line"></div>
  <p class="hint" id="hint"></p>
  <p class="hint" id="source" hidden></p>

  <table id="table" data-chart="line">
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script>
"use strict";
const $ = s => document.querySelector(s);
const DAY = 864e5;
const HUES = 8;
const DASHES = ["", "7 4", "2 3"]; // lines 9–16 are dashed and 17–24 dotted, so no two lines look the same
const parseD = s => new Date(s + "T00:00:00Z");
const isoD = d => d.toISOString().slice(0, 10);
const fmtD = d => d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric", timeZone:"UTC"});
const fmtS = v => (Math.round(v * 10) / 10).toLocaleString("en-GB", {minimumFractionDigits:1, maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- model: cumulative best-N score and rank for every pilot, every day ---------- */
function buildModel(data){
  const bestN = data.bestN || 6;
  const start = parseD(data.start), end = parseD(data.end);
  const D = Math.round((end - start) / DAY) + 1;
  const dates = Array.from({length: D}, (_, i) => new Date(start.getTime() + i * DAY));
  const pilots = data.pilots, P = pilots.length;
  const idx = new Map(pilots.map((p, i) => [p.id, i]));
  const byP = pilots.map(() => []);
  let firstDay = D - 1, lastDay = 0;
  for (const f of data.flights){
    const i = idx.get(f.p); if (i == null) continue;
    const d = Math.round((parseD(f.d) - start) / DAY); if (d < 0 || d >= D) continue;
    byP[i].push({...f, day: d, s: +f.s}); firstDay = Math.min(firstDay, d); lastDay = Math.max(lastDay, d);
  }
  const score = [], nf = [];
  byP.forEach(fl => {
    fl.sort((a, b) => a.day - b.day);
    const sc = new Float32Array(D), n = new Uint16Array(D);
    let top = [], k = 0, cur = 0, cnt = 0;
    for (let d = 0; d < D; d++){
      let changed = false;
      while (k < fl.length && fl[k].day === d){ top.push(fl[k].s); cnt++; k++; changed = true; }
      if (changed){ top.sort((a, b) => b - a); if (top.length > bestN) top.length = bestN; cur = top.reduce((a, b) => a + b, 0); }
      sc[d] = cur; n[d] = cnt;
    }
    score.push(sc); nf.push(n);
  });
  const rank = rankAll(score, D);
  // "Surname, First name" labels (club added for the two pilots who share a name), sorted by surname then first name
  pilots.forEach(p => {
    const club = / \(.+\)$/.test(p.name) ? " (" + p.club + ")" : "";
    p.label = p.last ? `${p.last}, ${p.first}${club}` : p.name;
  });
  const bySurname = pilots.map((_, i) => i).sort((a, b) =>
    (pilots[a].last || pilots[a].name).localeCompare(pilots[b].last || pilots[b].name, "en-GB") ||
    (pilots[a].first || "").localeCompare(pilots[b].first || "", "en-GB") || pilots[a].club.localeCompare(pilots[b].club));
  const byName = new Map();
  pilots.forEach((p, i) => { byName.set(p.name.toLowerCase(), i); byName.set(p.label.toLowerCase(), i); });
  const clubs = [...new Set(pilots.map(p => p.club).filter(Boolean))].sort();

  // Clubs: a club's score on a day is the sum of its best clubN (4) pilots' league scores that day
  const clubN = data.clubN || 4;
  const cIdx = new Map(clubs.map((c, k) => [c, k]));
  const members = clubs.map(() => []);
  pilots.forEach((p, i) => { const k = cIdx.get(p.club); if (k != null) members[k].push(i); });
  const cScore = [], cN = [], buf = [];
  for (const mem of members){
    const sc = new Float32Array(D), n = new Uint16Array(D);
    for (let d = 0; d < D; d++){
      buf.length = 0;
      for (const i of mem) if (score[i][d] > 0) buf.push(score[i][d]);
      buf.sort((a, b) => b - a);
      let t = 0; for (let j = 0; j < Math.min(clubN, buf.length); j++) t += buf[j];
      sc[d] = t; n[d] = buf.length; // n = club pilots with a score so far
    }
    cScore.push(sc); cN.push(n);
  }
  const cRank = rankAll(cScore, D);
  const cByName = new Map(clubs.map((c, k) => [c.toLowerCase(), k]));

  return {pilots, dates, D, score, rank, nf, byP, bestN, byName, bySurname, clubs, firstDay, lastDay, season: data.season,
          clubN, members, cScore, cRank, cN, cByName,
          types: data.types || [], gliders: data.gliders || [], sites: data.sites || [], flightUrl: data.flightUrl || ""};
}
// Rank on every day from scores: equal scores share a rank, and 0 = not ranked yet (no score)
function rankAll(score, D){
  const P = score.length, rank = score.map(() => new Uint16Array(D)), order = [...Array(P).keys()];
  for (let d = 0; d < D; d++){
    order.sort((a, b) => score[b][d] - score[a][d]);
    let r = 0;
    for (let j = 0; j < P; j++){
      const i = order[j], s = score[i][d];
      if (s <= 0) break;
      if (j === 0 || s < score[order[j - 1]][d]) r = j + 1; // ties share a rank
      rank[i][d] = r;
    }
  }
  return rank;
}
// A club's pilots counting towards its score on a given day, best first
function clubCounted(c, d){
  return M.members[c].filter(i => M.score[i][d] > 0).sort((a, b) => M.score[b][d] - M.score[a][d]).slice(0, M.clubN);
}
// The standings being shown: pilots, or clubs. Everything that draws lines, legends, tables and selections goes
// through this, so both kinds behave the same way.
let E;
function entities(){
  if (S.std === "clubs") return {kind:"clubs", n:M.clubs.length, score:M.cScore, rank:M.cRank, count:M.cN,
    name:c => M.clubs[c], label:c => M.clubs[c], key:c => M.clubs[c], sorted:M.clubs.map((_, c) => c), byName:M.cByName,
    noun:"club", nouns:"clubs"};
  return {kind:"pilots", n:M.pilots.length, score:M.score, rank:M.rank, count:M.nf,
    name:i => M.pilots[i].name, label:i => M.pilots[i].label, key:i => M.pilots[i].id, sorted:M.bySurname, byName:M.byName,
    noun:"pilot", nouns:"pilots"};
}
// The flights counting towards a pilot's score on a given day, best first (matches the league's Flight 1–6)
function countedFlights(i, d){
  return M.byP[i].filter(f => f.day <= d).sort((a, b) => b.s - a.s).slice(0, M.bestN);
}

/* ---------- state & selection ---------- */
let M;
const S = {mode:"top", chart:"line", metric:"score", n:10, at:0, k:4, club:"", picks:[], focus:null, hl:null, pin:null, from:0, to:0, barPilot:null, rangeKey:null, barScale:"compact", barFlights:"all", std:"pilots", saved:{}};
// Who is chosen (Chosen, Around, Flights, picked-out line) is kept separately for pilots and for clubs
const PER_STD = ["picks", "focus", "barPilot", "pin", "hl"];
const slotOf = new Map(); // pilot index -> style slot; a pilot keeps its colour while it stays on the chart

function selection(){
  const {rank} = E, at = S.at;
  const rankedAt = filter => [...Array(E.n).keys()].filter(i => rank[i][at] > 0 && filter(i)).sort((a, b) => rank[a][at] - rank[b][at]);
  switch (S.mode){
    case "top": return rankedAt(() => true).slice(0, S.n);
    case "pick": return S.picks.slice();
    case "club": return E.kind === "pilots" ? rankedAt(i => M.pilots[i].club === S.club).slice(0, S.n) : [];
    case "around": {
      if (S.focus == null) return [];
      const r = rank[S.focus][at];
      if (!r) return [S.focus];
      return rankedAt(i => Math.abs(rank[i][at] - r) <= S.k);
    }
  }
  return [];
}
function assignSlots(sel){
  const keep = new Set(sel);
  for (const i of [...slotOf.keys()]) if (!keep.has(i)) slotOf.delete(i);
  const used = new Set(slotOf.values());
  for (const i of sel){
    if (slotOf.has(i)) continue;
    let s = 0; while (used.has(s)) s++;
    slotOf.set(i, s); used.add(s);
  }
}
const colour = i => `var(--s${(slotOf.get(i) ?? 0) % HUES + 1})`;
const dash = i => DASHES[Math.floor((slotOf.get(i) ?? 0) / HUES) % DASHES.length];
const keySvg = i => `<svg class="key" width="18" height="6" aria-hidden="true"><line x1="1" x2="17" y1="3" y2="3" stroke="${colour(i)}" stroke-width="2.5" stroke-dasharray="${dash(i)}" stroke-linecap="round"/></svg>`;

/* ---------- shared bits ---------- */
function niceTicks(lo, hi, count){
  const span = hi - lo || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(m => m * mag).find(s => span / s <= count) || 10 * mag;
  const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) t.push(Math.round(v * 1000) / 1000);
  return t;
}
let geom = null;
// x-axis shared by the line and bar charts: month ticks, or weekly ticks when zoomed in
function timeAxis(d0, d1, x, m, W, H, grid){
  let g = "", lastLabel = -Infinity;
  const short = d1 - d0 < 75;
  for (let d = d0; d <= d1; d++){
    const dt = M.dates[d];
    if (!(short ? dt.getUTCDay() === 1 : dt.getUTCDate() === 1)) continue;
    const label = short ? dt.toLocaleDateString("en-GB", {day:"numeric", month:"short", timeZone:"UTC"})
                        : dt.toLocaleDateString("en-GB", {month:"short", timeZone:"UTC"}) + (dt.getUTCMonth() === 0 ? " " + dt.getUTCFullYear() : "");
    const X = x(d);
    if (grid) g += `<line x1="${X}" x2="${X}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grid)"/>`;
    g += `<line x1="${X}" x2="${X}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="var(--axis)"/>`;
    if (X - lastLabel >= 36){ g += `<text x="${X}" y="${H - m.b + 17}" text-anchor="middle">${label}</text>`; lastLabel = X; }
  }
  return g + `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--axis)"/>`;
}

function render(){
  if (!M) return; // no season loaded yet
  E = entities();
  const sel = selection();
  assignSlots(sel);
  $("#tip").style.display = "none";
  const shown = S.chart === "bar" ? [barPilot(sel)].filter(i => i != null) : sel;
  const key = E.kind + ":" + S.chart + ":" + (S.chart === "bar" ? S.barFlights + ":" : "") + shown.slice().sort((a, b) => a - b).join(",");
  if (key !== S.rangeKey){
    S.rangeKey = key;
    const barDays = i => (E.kind === "clubs" ? clubBars(i) : flightBars(i)).bars.map(b => b.day);
    const flyDays = i => E.kind === "clubs" ? M.members[i].flatMap(p => M.byP[p].map(f => f.day)) : M.byP[i].map(f => f.day);
    fitRange(S.chart === "bar" ? (shown.length ? barDays(shown[0]) : []) : shown.flatMap(flyDays));
  }
  if (S.chart === "bar") (E.kind === "clubs" ? renderClubBars : renderBars)(sel); else renderLines(sel);
  renderTable(sel);
  renderChips();
  applyHighlight(); // re-apply to the freshly drawn table
  $("#hint").textContent = hintText();
}

/* ---------- line chart ---------- */
function renderLines(sel){
  const isRank = S.metric === "rank";
  const val = (i, d) => isRank ? (E.rank[i][d] || null) : E.score[i][d];

  const wrap = $("#chart"), W = Math.max(320, wrap.clientWidth);
  const H = Math.round(Math.max(300, Math.min(540, W * 0.52)));
  const m = {t:26, r:16, b:28, l:48};
  const d0 = S.from, d1 = Math.max(S.to, S.from + 1);
  const x = d => m.l + (d - d0) / (d1 - d0) * (W - m.l - m.r);

  let ymin, ymax;
  if (isRank){
    let worst = 1, worstAt = 1;
    for (const i of sel){
      for (let d = d0; d <= d1; d++) worst = Math.max(worst, E.rank[i][d]);
      worstAt = Math.max(worstAt, E.rank[i][Math.min(Math.max(S.at, d0), d1)] || 0);
    }
    // Focus the axis on where these pilots sit; much lower early-season ranks run off the bottom (clipped)
    ymin = 1; ymax = Math.max(5, Math.min(worst, Math.ceil(worstAt * 2.5) + 5));
  } else {
    let best = 0;
    for (const i of sel) for (let d = d0; d <= d1; d++) best = Math.max(best, E.score[i][d]);
    ymin = 0; ymax = Math.max(best * 1.05, 10);
  }
  const ih = H - m.t - m.b;
  const y = v => isRank ? m.t + (v - ymin) / (ymax - ymin) * ih : m.t + ih - (v - ymin) / (ymax - ymin) * ih;
  geom = {kind:"line", x, y, d0, d1, m, W, H, val, sel, isRank};

  let g = `<defs><clipPath id="plot"><rect x="${m.l}" y="${m.t - 3}" width="${W - m.l - m.r}" height="${ih + 6}"/></clipPath></defs>`;
  const yt = niceTicks(ymin, ymax, 6); if (isRank && yt[0] !== 1) yt.unshift(1);
  for (const v of yt){
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${isRank ? v : v.toLocaleString("en-GB")}</text>`;
  }
  g += timeAxis(d0, d1, x, m, W, H);
  g += `<text x="${m.l - 8}" y="${m.t - 12}" text-anchor="end" style="font-size:10px">${isRank ? "rank" : "score"}</text>`;
  if (S.at >= d0 && S.at <= d1)
    g += `<line x1="${x(S.at)}" x2="${x(S.at)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;

  const path = i => {
    let p = "", pen = false;
    for (let d = d0; d <= d1; d++){
      const v = val(i, d);
      if (v == null){ pen = false; continue; }
      p += (pen ? "L" : "M") + x(d).toFixed(1) + " " + y(v).toFixed(1); pen = true;
    }
    return p;
  };
  // crosshair target first, then the lines on top so they can be hovered and clicked
  g += `<rect id="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${ih}" fill="transparent" style="cursor:crosshair"/>`;
  g += `<g id="series" clip-path="url(#plot)">`;
  for (const i of sel.slice().reverse()) // leaders drawn last, on top
    g += `<g class="series" data-i="${i}"><path class="vis" d="${path(i)}" fill="none" stroke="${colour(i)}" stroke-dasharray="${dash(i)}" stroke-width="2" stroke-linejoin="round"/><path class="hitline" d="${path(i)}" fill="none" stroke="transparent" stroke-width="12"/></g>`;
  g += `</g><g id="hlLabel" pointer-events="none"></g>`;
  g += `<line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--text2)" stroke-width="1" visibility="hidden" pointer-events="none"/>`;
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${isRank ? "Rank" : "Score"} over time for ${sel.length} ${E.nouns}">${g}</svg>`;

  const svg = $("#chart svg");
  svg.addEventListener("pointermove", onLineMove);
  svg.addEventListener("pointerleave", () => { $("#tip").style.display = "none"; $("#xh").setAttribute("visibility", "hidden"); });
  $("#hit").addEventListener("click", e => { S.at = Math.min(M.lastDay, Math.max(M.firstDay, dayAt(e))); $("#at").value = S.at; update(); });
  svg.querySelectorAll(".series").forEach(el => {
    const i = +el.dataset.i;
    el.addEventListener("pointerenter", () => setHl(i));
    el.addEventListener("pointerleave", () => setHl(null));
    el.addEventListener("click", () => togglePin(i));
  });
  renderLineLegend(sel);
  applyHighlight();
}

/* ---------- picking out one pilot: hover (temporary) or click (pinned) ---------- */
function focusPilot(){
  const sel = geom && geom.kind === "line" ? geom.sel : [];
  for (const i of [S.hl, S.pin]) if (i != null && sel.includes(i)) return i;
  return S.mode === "around" && sel.includes(S.focus) ? S.focus : null;
}
function setHl(i){ if (S.hl !== i){ S.hl = i; applyHighlight(); } }
function togglePin(i){ S.pin = S.pin === i ? null : i; applyHighlight(); }
function applyHighlight(){
  if (!geom || geom.kind !== "line") return;
  const f = focusPilot(), chart = $("#chart"), legend = $("#lineLegend");
  chart.classList.toggle("hl", f != null); legend.classList.toggle("hl", f != null);
  chart.querySelectorAll(".series").forEach(el => {
    const on = +el.dataset.i === f;
    el.classList.toggle("on", on);
    if (on) el.parentNode.appendChild(el); // bring to the front
  });
  legend.querySelectorAll(".li").forEach(el => {
    el.classList.toggle("on", +el.dataset.i === f);
    el.setAttribute("aria-pressed", +el.dataset.i === S.pin);
  });
  document.querySelectorAll("#rows tr[data-i]").forEach(tr => tr.classList.toggle("on", +tr.dataset.i === f));
  // name label at the end of the picked-out line
  const lab = $("#hlLabel"); lab.innerHTML = "";
  if (f == null) return;
  const {x, y, val, d0, d1, m, W, H} = geom;
  let d = d1; while (d > d0 && val(f, d) == null) d--;
  const v = val(f, d); if (v == null) return;
  const X = Math.min(x(d), W - m.r) - 4, Y0 = Math.max(m.t, Math.min(H - m.b, y(v)));
  const Y = Y0 - 9 < m.t + 4 ? Y0 + 18 : Y0 - 9;
  const rk = E.rank[f][S.at];
  lab.innerHTML = `<text x="${X}" y="${Y}" text-anchor="end" paint-order="stroke" stroke="var(--surface)" stroke-width="5" stroke-linejoin="round" style="fill:var(--text);font-size:13px;font-weight:650">${esc(E.name(f))}${rk ? ` <tspan style="font-weight:400;fill:var(--text2)">#${rk}</tspan>` : ""}</text>`;
}
function renderLineLegend(sel){
  const at = S.at;
  const order = sel.slice().sort((a, b) => (E.rank[a][at] || 1e9) - (E.rank[b][at] || 1e9));
  $("#lineLegend").innerHTML = order.map(i => {
    const r = E.rank[i][at];
    return `<button class="li" data-i="${i}" aria-pressed="false" title="Click to see ${esc(E.name(i))}'s ${E.kind === "clubs" ? "pilots" : "flights"}">${keySvg(i)}<span>${r ? `<span class="rk">#${r}</span> ` : ""}${esc(E.name(i))}</span></button>`;
  }).join("");
}
function dayAt(e){
  const r = $("#chart svg").getBoundingClientRect(), {m, W, d0, d1} = geom;
  const px = (e.clientX - r.left) * (W / r.width);
  return Math.max(d0, Math.min(d1, Math.round(d0 + (px - m.l) / (W - m.l - m.r) * (d1 - d0))));
}
function onLineMove(e){
  const r = $("#chart svg").getBoundingClientRect(), {x, val, sel, isRank, m, W, H} = geom;
  const px = (e.clientX - r.left) * (W / r.width), py = (e.clientY - r.top) * (H / r.height);
  if (px < m.l || px > W - m.r || py < m.t || py > H - m.b){ $("#tip").style.display = "none"; $("#xh").setAttribute("visibility", "hidden"); return; }
  const d = dayAt(e), f = focusPilot();
  const xh = $("#xh"); xh.setAttribute("x1", x(d)); xh.setAttribute("x2", x(d)); xh.setAttribute("visibility", "visible");
  const rows = sel.map(i => ({i, v: val(i, d)})).filter(r => r.v != null).sort((a, b) => isRank ? a.v - b.v : b.v - a.v);
  const max = 14;
  let h = `<div class="d">${fmtD(M.dates[d])}</div>`;
  for (const r of rows.slice(0, max))
    h += `<div class="r"${r.i === f ? ' style="font-weight:700"' : ""}>${keySvg(r.i)}<span class="n">${esc(E.name(r.i))}</span><span class="v">${isRank ? "#" + r.v : fmtS(r.v)}</span></div>`;
  if (rows.length > max) h += `<div class="r m">+ ${rows.length - max} more</div>`;
  if (!rows.length) h += `<div class="r m">No ranked ${E.nouns} yet</div>`;
  showTip(h, e);
}

/* ---------- stacked bars: one pilot, a bar on each flying day showing the flights counting at that point ---------- */
function barPilot(sel){
  if (S.barPilot != null) return S.barPilot;
  const byRank = sel.slice().sort((a, b) => (E.rank[a][S.at] || 1e9) - (E.rank[b][S.at] || 1e9));
  S.barPilot = S.mode === "around" && sel.includes(S.focus) ? S.focus : (byRank[0] ?? null);
  return S.barPilot;
}
// A pilot's flying days, and the bars the Flights setting keeps:
//   all     - every flying day, with hollow circles for flights that never counted
//   scoring - only days with a flight that counted at the time (never-counted flights left out)
//   best    - only days with one of the final best flights, stacking just those flights
// "all" holds every flying day with the real league total, for the total line.
function flightBars(i){
  const fl = M.byP[i];
  const finalBest = countedFlights(i, M.D - 1);           // the flights that end up counting, best first
  const finalNo = new Map(finalBest.map((f, n) => [f, n])); // flight -> 0..5, the league's Flight 1–6
  const days = [...new Set(fl.map(f => f.day))].sort((a, b) => a - b);
  const all = days.map(day => {
    const counted = fl.filter(f => f.day <= day).sort((a, b) => b.s - a.s).slice(0, M.bestN);
    const today = fl.filter(f => f.day === day);
    return {day, total: counted.reduce((a, f) => a + f.s, 0), counted, today,
            missed: today.filter(f => !counted.includes(f))}; // flown today but not counting
  });
  const mode = S.barFlights;
  const bars = all.filter(b => mode === "all" ? true
      : mode === "scoring" ? b.today.some(f => b.counted.includes(f))
      : b.today.some(f => finalNo.has(f)))
    .map(b => {
      const stack = (mode === "best" ? b.counted.filter(f => finalNo.has(f)) : b.counted.slice())
        .sort((a, c) => a.day - c.day || c.s - a.s); // oldest at the bottom
      return {day: b.day, league: b.total, total: stack.reduce((a, f) => a + f.s, 0), stack,
              missed: mode === "all" ? b.missed : []};
    });
  return {all, bars, finalBest, finalNo};
}
// The time scale for a bar chart: every bar the same width, fitted to the bars in view
function barScale(bars, d0, d1, m, pw){
  const inView = bars.filter(b => b.day >= d0 && b.day <= d1);
  let x, edge, bw;
  if (S.barScale === "calendar"){
    // True dates: every bar the same width, as wide as the closest pair of flying days allows
    const dayPx = pw / (d1 - d0);
    x = d => m.l + (d - d0) * dayPx; edge = x;
    let minGap = Infinity;
    for (let k = 1; k < inView.length; k++) minGap = Math.min(minGap, inView[k].day - inView[k - 1].day);
    bw = Math.max(2, Math.min(28, minGap * dayPx - 2, 0.7 * pw / Math.max(1, inView.length)));
  } else {
    // Compact: each flying day gets one equal slot; a run of g days without flights takes 0.5·√g slots
    const fly = new Set(inView.map(b => b.day)), n = d1 - d0 + 1, wt = new Float64Array(n);
    for (let d = d0; d <= d1;){
      if (fly.has(d)){ wt[d - d0] = 1; d++; continue; }
      let e = d; while (e <= d1 && !fly.has(e)) e++;
      const g = e - d; for (let k = d; k < e; k++) wt[k - d0] = 0.5 * Math.sqrt(g) / g;
      d = e;
    }
    const cum = new Float64Array(n + 1); for (let k = 0; k < n; k++) cum[k + 1] = cum[k] + wt[k];
    const unit = pw / cum[n], at = d => Math.max(0, Math.min(n - 1, d - d0));
    x = d => m.l + (cum[at(d)] + wt[at(d)] / 2) * unit;          // centre of a day's slot
    edge = d => m.l + cum[Math.max(0, Math.min(n, d - d0))] * unit; // start of a day (month boundaries)
    bw = Math.max(3, Math.min(28, unit * 0.75));
  }
  return {x, edge, bw};
}
function renderBars(sel){
  const wrap = $("#chart"), W = Math.max(320, wrap.clientWidth);
  const i = barPilot(sel);
  if (i != null) $("#barPilot").value = String(i);
  geom = {kind:"bar"};
  if (i == null){ wrap.innerHTML = `<p class="hint">No pilot selected.</p>`; $("#barLegend").innerHTML = ""; return; }

  const {all, bars, finalBest, finalNo} = flightBars(i);

  const H = Math.round(Math.max(300, Math.min(540, W * 0.52)));
  const m = {t:26, r:16, b:28, l:56};
  const d0 = S.from, d1 = Math.max(S.to, S.from + 1);
  const pw = W - m.l - m.r, ih = H - m.t - m.b;
  const {x, edge, bw} = barScale(bars, d0, d1, m, pw);
  bars.forEach(b => b.w = bw);
  const ymax = Math.max(10, ...all.map(b => b.total)) * 1.06; // the total line can sit above "Best" bars
  const y = v => m.t + ih - v / ymax * ih;
  const segs = [];

  let g = `<defs><clipPath id="plot"><rect x="${m.l - 30}" y="0" width="${pw + 60}" height="${H}"/></clipPath></defs>`;
  for (const v of niceTicks(0, ymax, 6)){
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v.toLocaleString("en-GB")}</text>`;
  }
  g += timeAxis(d0, d1, edge, m, W, H, S.barScale !== "calendar");
  g += `<text x="${m.l - 8}" y="${m.t - 12}" text-anchor="end" style="font-size:10px">score</text>`;
  if (S.at >= d0 && S.at <= d1)
    g += `<line x1="${x(S.at)}" x2="${x(S.at)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  g += `<g clip-path="url(#plot)">`;
  for (const b of bars){
    if (b.day < d0 - 1 || b.day > d1 + 1) continue;
    const bw = b.w, X = x(b.day) - bw / 2;
    let base = 0;
    for (const f of b.stack){
      const top = y(base + f.s), bottom = y(base), h = Math.max(1, bottom - top - (bottom - top > 3 ? 1 : 0)); // 1px gap between segments
      const n = finalNo.get(f), isNew = f.day === b.day;
      const fill = n == null ? "var(--neutral)" : `var(--s${n + 1})`;
      segs.push({f, bar: b, isNew});
      g += link(f, `<rect x="${X}" y="${top}" width="${bw}" height="${h}" fill="${fill}" data-seg="${segs.length - 1}"/>`, i);
      base += f.s;
    }
    let cy = y(b.total) - 7;
    for (const f of b.missed){ // a flight that didn't count even on the day it was flown
      segs.push({f, bar: b, missed: true});
      g += link(f, `<circle cx="${x(b.day)}" cy="${cy}" r="${Math.min(4, Math.max(2.5, bw / 2))}" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" data-seg="${segs.length - 1}"/>`, i);
      cy -= 9;
    }
  }
  // the pilot's league total, day by day: it steps up wherever a bar adds points
  const lo = Math.max(0, d0), hi = Math.min(M.D - 1, d1);
  let tl = `M${x(lo).toFixed(1)} ${y(M.score[i][lo]).toFixed(1)}`;
  for (const b of all) if (b.day > lo && b.day <= hi) // flat, then up at the day's left edge (on every flying day, shown or not)
    tl += `H${(x(b.day) - bw / 2).toFixed(1)}V${y(b.total).toFixed(1)}`;
  tl += `H${x(hi).toFixed(1)}`;
  g += `<path d="${tl}" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round" opacity="0.8" pointer-events="none"/>`;
  g += `</g>`;
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Counted flights over time for ${esc(M.pilots[i].name)}">${g}</svg>`;

  // summary: like the league table, the pilot's final total and best flights (score + flight-type icon)
  const p = M.pilots[i], rk = M.rank[i][S.at];
  const sq = c => `<svg class="key" width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="${c}"/></svg>`;
  const cells = finalBest.map((f, n) => {
    const type = M.types[f.t] || "", url = f.f && M.flightUrl ? M.flightUrl.replace("{f}", f.f) : null;
    const tip = `${type} · ${fmtD(M.dates[f.day])}${M.sites[f.x] ? " · " + M.sites[f.x] : ""}`;
    const inner = `${typeIcon(type)}<span class="sc">${fmtS(f.s)}</span>`;
    return `<span class="fc" style="--c:var(--s${n + 1})" title="${esc(tip)}">${url ? `<a href="${url}" target="_blank" rel="noopener" aria-label="${esc(fmtS(f.s) + " points, " + tip)}">${inner}</a>` : inner}</span>`;
  }).join("");
  // key: one entry per distinct icon shown (shape + declared + tow launch), in TYPE_KINDS order
  const usedIcons = [...new Map(finalBest.map(f => {
    const t = M.types[f.t] || "", k = kindOf(t), tow = /tow-launch/i.test(t), dec = /declared/i.test(t);
    return [`${k.id}|${tow}|${dec}`, {k, tow, dec}];
  })).values()].sort((a, b) => TYPE_KINDS.indexOf(a.k) - TYPE_KINDS.indexOf(b.k) || a.tow - b.tow || a.dec - b.dec);
  $("#barLegend").innerHTML =
    `<div class="ps-head"><strong>${esc(p.name)}</strong><span class="m">${[p.club, p.wing, rk ? "#" + rk + " on " + fmtD(M.dates[S.at]) : ""].filter(Boolean).map(esc).join(" · ")}</span></div>
     <div class="ps-row"><span class="ps-total"><span class="m">Total</span> ${fmtS(finalBest.reduce((a, f) => a + f.s, 0))}</span>${cells}</div>
     <div class="ps-keys">
       ${S.barFlights !== "best" ? `<span class="lg">${sq("var(--neutral)")} counted for a while, later replaced</span>` : ""}
       <span class="lg"><svg class="key" width="18" height="6" aria-hidden="true"><line x1="1" x2="17" y1="3" y2="3" stroke="var(--text)" stroke-width="2"/></svg> total score${S.barFlights === "best" ? " (bars show only the final best flights flown so far)" : ""}</span>
       ${S.barFlights === "all" ? `<span class="lg"><svg class="key" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg> flown but never counted</span>` : ""}
       ${usedIcons.map(u => `<span class="lg">${ico(u.k.glyph, u.tow, u.dec)} ${[u.tow ? "tow-launch" : "", u.dec ? "declared" : "", u.k.label].filter(Boolean).join(" ")}</span>`).join("")}
     </div>`;

  wrap.querySelectorAll("[data-seg]").forEach(el => {
    el.addEventListener("pointermove", e => {
      const sg = segs[+el.dataset.seg], f = sg.f, n = finalNo.get(f);
      const status = sg.missed ? "Didn't count: lower than the best " + M.bestN + " at the time"
        : n != null ? `Counts in the final total as flight ${n + 1}` : "Counted for a while, later replaced by a better flight";
      showTip(`<div class="d">${fmtD(M.dates[f.day])} — ${fmtS(f.s)} pts</div>
        <div class="m">${esc(M.sites[f.x] || "")}${M.types[f.t] ? " · " + esc(M.types[f.t]) : ""}</div>
        <div class="m">${esc(M.gliders[f.g] || "")}</div>
        <div style="margin-top:4px">${status}${sg.isNew ? " (new on this date)" : ""}</div>
        <div class="m">Total on ${fmtD(M.dates[sg.bar.day])}: ${fmtS(sg.bar.league)}</div>
        <div class="m" style="margin-top:4px">Click to open the flight on xcleague.com</div>`, e);
    });
    el.addEventListener("pointerleave", () => { $("#tip").style.display = "none"; });
  });
}
/* ---------- club bars: one club, a bar on each day its pilots flew, stacking the pilots counting for it then ---------- */
// Like flightBars, but the segments are pilots (their league score that day) instead of flights.
//   all     - every day a club pilot flew, with hollow circles for pilots whose flying that day didn't add to the club
//   scoring - only days the club's score went up
//   best    - only days one of the final top 4 pilots' score went up, stacking just those pilots
function clubBars(c){
  const mem = M.members[c];
  const finalTop = clubCounted(c, M.D - 1);              // the pilots counting at the end, best first
  const finalNo = new Map(finalTop.map((p, n) => [p, n])); // pilot -> 0..3
  const flewOn = new Map();
  for (const p of mem) for (const f of M.byP[p]) { if (!flewOn.has(f.day)) flewOn.set(f.day, new Set()); flewOn.get(f.day).add(p); }
  const days = [...flewOn.keys()].sort((a, b) => a - b);
  const up = (p, day) => M.score[p][day] > (day ? M.score[p][day - 1] : 0);
  const all = days.map(day => {
    const counted = clubCounted(c, day), flew = [...flewOn.get(day)];
    const helped = flew.filter(p => counted.includes(p) && up(p, day)); // their flying added to the club's score
    return {day, total: M.cScore[c][day], counted, flew, helped};
  });
  const mode = S.barFlights;
  // stack order: the final pilots 1-4 from the bottom, then replaced pilots, higher score first
  const order = day => (a, b) => (finalNo.get(a) ?? 99) - (finalNo.get(b) ?? 99) || M.score[b][day] - M.score[a][day];
  const bars = all.filter(b => mode === "all" ? true
      : mode === "scoring" ? b.helped.length > 0
      : b.flew.some(p => finalNo.has(p) && up(p, b.day)))
    .map(b => {
      const who = mode === "best" ? finalTop.filter(p => M.score[p][b.day] > 0) : b.counted.slice();
      const stack = who.sort(order(b.day)).map(p => ({p, s: M.score[p][b.day], isNew: b.flew.includes(p) && up(p, b.day)})); // final pilot 1 at the bottom
      return {day: b.day, league: b.total, total: stack.reduce((a, g) => a + g.s, 0), stack,
              missed: mode === "all" ? b.flew.filter(p => !b.helped.includes(p)) : []};
    });
  return {all, bars, finalTop, finalNo};
}
function renderClubBars(sel){
  const wrap = $("#chart"), W = Math.max(320, wrap.clientWidth);
  const c = barPilot(sel);
  if (c != null) $("#barPilot").value = String(c);
  geom = {kind:"bar"};
  if (c == null){ wrap.innerHTML = `<p class="hint">No club selected.</p>`; $("#barLegend").innerHTML = ""; return; }

  const {all, bars, finalTop, finalNo} = clubBars(c);
  const H = Math.round(Math.max(300, Math.min(540, W * 0.52)));
  const m = {t:26, r:16, b:28, l:56};
  const d0 = S.from, d1 = Math.max(S.to, S.from + 1);
  const pw = W - m.l - m.r, ih = H - m.t - m.b;
  const {x, edge, bw} = barScale(bars, d0, d1, m, pw);
  const ymax = Math.max(10, ...all.map(b => b.total)) * 1.06;
  const y = v => m.t + ih - v / ymax * ih;
  const segs = [];

  let g = `<defs><clipPath id="plot"><rect x="${m.l - 30}" y="0" width="${pw + 60}" height="${H}"/></clipPath></defs>`;
  for (const v of niceTicks(0, ymax, 6)){
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v.toLocaleString("en-GB")}</text>`;
  }
  g += timeAxis(d0, d1, edge, m, W, H, S.barScale !== "calendar");
  g += `<text x="${m.l - 8}" y="${m.t - 12}" text-anchor="end" style="font-size:10px">score</text>`;
  if (S.at >= d0 && S.at <= d1)
    g += `<line x1="${x(S.at)}" x2="${x(S.at)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  g += `<g clip-path="url(#plot)">`;
  for (const b of bars){
    if (b.day < d0 - 1 || b.day > d1 + 1) continue;
    const X = x(b.day) - bw / 2;
    let base = 0;
    for (const sg of b.stack){
      const top = y(base + sg.s), bottom = y(base), h = Math.max(1, bottom - top - (bottom - top > 3 ? 1 : 0));
      const n = finalNo.get(sg.p);
      segs.push({...sg, bar: b});
      g += `<rect class="cseg" x="${X}" y="${top}" width="${bw}" height="${h}" fill="${n == null ? "var(--neutral)" : `var(--s${n + 1})`}" data-seg="${segs.length - 1}"/>`;
      base += sg.s;
    }
    let cy = y(b.total) - 7;
    for (const p of b.missed){
      segs.push({p, s: M.score[p][b.day], bar: b, missed: true});
      g += `<circle class="cseg" cx="${x(b.day)}" cy="${cy}" r="${Math.min(4, Math.max(2.5, bw / 2))}" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" data-seg="${segs.length - 1}"/>`;
      cy -= 9;
    }
  }
  const lo = Math.max(0, d0), hi = Math.min(M.D - 1, d1);
  let tl = `M${x(lo).toFixed(1)} ${y(M.cScore[c][lo]).toFixed(1)}`;
  for (const b of all) if (b.day > lo && b.day <= hi) tl += `H${(x(b.day) - bw / 2).toFixed(1)}V${y(b.total).toFixed(1)}`;
  tl += `H${x(hi).toFixed(1)}`;
  g += `<path d="${tl}" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round" opacity="0.8" pointer-events="none"/>`;
  g += `</g>`;
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Pilots counting for ${esc(M.clubs[c])} over time">${g}</svg>`;

  // summary: like the league's club table, the club's final total and the pilots who make it up
  const rk = M.cRank[c][S.at], sq = col => `<svg class="key" width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="${col}"/></svg>`;
  const cells = finalTop.map((p, n) => `<span class="fc" style="--c:var(--s${n + 1})"><button data-flights="${p}" title="See ${esc(M.pilots[p].name)}'s flights"><span class="sc">${fmtS(M.score[p][M.D - 1])}</span> ${esc(M.pilots[p].name)}</button></span>`).join("");
  $("#barLegend").innerHTML =
    `<div class="ps-head"><strong>${esc(M.clubs[c])}</strong><span class="m">${[rk ? "#" + rk + " on " + fmtD(M.dates[S.at]) : "", M.cN[c][S.at] + " pilots with a score"].filter(Boolean).join(" · ")}</span></div>
     <div class="ps-row"><span class="ps-total"><span class="m">Total</span> ${fmtS(M.cScore[c][M.D - 1])}</span>${cells}</div>
     <div class="ps-keys">
       <span class="lg">Club score = best ${M.clubN} pilots' scores added together</span>
       ${S.barFlights !== "best" ? `<span class="lg">${sq("var(--neutral)")} counted for a while, later replaced</span>` : ""}
       <span class="lg"><svg class="key" width="18" height="6" aria-hidden="true"><line x1="1" x2="17" y1="3" y2="3" stroke="var(--text)" stroke-width="2"/></svg> club score${S.barFlights === "best" ? " (bars show only the final top " + M.clubN + ")" : ""}</span>
       ${S.barFlights === "all" ? `<span class="lg"><svg class="key" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg> flew, but didn't add to the club score</span>` : ""}
     </div>`;

  wrap.querySelectorAll("[data-seg]").forEach(el => {
    el.addEventListener("pointermove", e => {
      const sg = segs[+el.dataset.seg], n = finalNo.get(sg.p);
      const status = sg.missed ? `Flew, but didn't add to the club score`
        : n != null ? `Counts in the final club score as pilot ${n + 1}` : `Counted for a while, later replaced by a better club pilot`;
      showTip(`<div class="d">${fmtD(M.dates[sg.bar.day])}</div>
        <div><strong>${esc(M.pilots[sg.p].name)}</strong> — ${fmtS(sg.s)} pts</div>
        <div style="margin-top:4px">${status}${sg.isNew ? " (score went up on this date)" : ""}</div>
        <div class="m">Club score on ${fmtD(M.dates[sg.bar.day])}: ${fmtS(sg.bar.league)}</div>
        <div class="m" style="margin-top:4px">Click to see this pilot's flights</div>`, e);
    });
    el.addEventListener("pointerleave", () => { $("#tip").style.display = "none"; });
    el.addEventListener("click", () => showPilotFlights(segs[+el.dataset.seg].p));
  });
}
// Jump from a club to one of its pilots' Breakdown

};

function link(f, inner, i, label){
  const url = f.f && M.flightUrl ? M.flightUrl.replace("{f}", f.f) : null;

  return `<a href="${url}" target="_blank" rel="noopener" aria-label="${esc(M.pilots[i].name)}, ${fmtS(f.s)} points, ${fmtD(M.dates[f.day])}">${label ? label + ": " : ""}${inner}</a>`;

function showTip(html, e){
  const tip = $("#tip"); tip.innerHTML = html; tip.style.display = "block";
  const wr = $("#chartWrap").getBoundingClientRect();
  let left = e.clientX - wr.left + 14; if (left + tip.offsetWidth > wr.width) left = e.clientX - wr.left - tip.offsetWidth - 14;
  tip.style.left = Math.max(0, left) + "px"; tip.style.top = Math.max(0, e.clientY - wr.top - 20) + "px";
}

function hintText(){
  if (E.kind === "clubs"){
    if (S.chart === "bar") return `A bar on each day the club's pilots flew, stacking the pilots counting for the club that day; each segment is that pilot's league score, and the line is the club score. Colours are the final best ${M.clubN} pilots, pilot 1 at the bottom. Show: All shows every flying day, Scoring only days the club score went up, Best only the final ${M.clubN} pilots. Click a segment or a pilot above the chart to see that pilot's flights.`;

/* ---------- wiring ---------- */
// Period: first to last flight of the pilots shown (2 days' margin, at least 3 weeks); the whole league if none
function fitRange(days){
  let a = M.firstDay, b = M.lastDay;
  if (days.length){
    a = Math.min(...days) - 2; b = Math.max(...days) + 2;
    if (b - a < 21){ const mid = Math.round((a + b) / 2); a = mid - 10; b = mid + 11; }
  }
  S.from = Math.max(0, a); S.to = Math.min(M.D - 1, b);
  syncRangeInputs();
}
function syncRangeInputs(){ $("#from").value = isoD(M.dates[S.from]); $("#to").value = isoD(M.dates[S.to]); }
function update(){
  $("#atLbl").textContent = fmtD(M.dates[S.at]);
  for (const [id, key] of [["#std", "std"], ["#mode", "mode"], ["#metric", "metric"], ["#chartType", "chart"], ["#barScale", "barScale"], ["#barFlights", "barFlights"]])
    document.querySelectorAll(id + " button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S[key]));
  document.querySelectorAll("[data-for]").forEach(el => el.hidden = !el.dataset.for.split(" ").includes(S.mode));
  document.querySelectorAll("[data-chart]").forEach(el => el.hidden = el.dataset.chart !== S.chart);
  document.querySelectorAll("[data-std]").forEach(el => el.hidden = el.dataset.std !== S.std);
  $("#barLegend").hidden = S.chart !== "bar";
  $("#search").placeholder = S.mode === "pick" ? `Add a ${E.noun}…` : "Type a name…";
  $("#sub").textContent = `Rank or league score for each ${E.noun}, day by day through the ${M.season} season (${E.n} ${E.nouns}).`;
  setTips();
  render();
}

// Words and lists that depend on whether pilots or clubs are shown
function syncEntityLists(){
  E = entities();
  document.querySelectorAll(".noun").forEach(el => el.textContent = E.nouns);
  document.querySelectorAll(".noun1").forEach(el => el.textContent = el.classList.contains("cap") ? E.noun[0].toUpperCase() + E.noun.slice(1) : E.noun);
  $("#names").innerHTML = E.sorted.map(i => `<option value="${esc(E.label(i))}">`).join("");
  $("#barPilot").innerHTML = E.sorted.map(i => `<option value="${i}">${esc(E.label(i))}</option>`).join("");

  else if (S.mode !== "pick") $("#search").value = "";

// Default choices for the standings shown: the top 3 to compare, and someone mid-table to look around
function defaultChoices(){
  const top = [...Array(E.n).keys()].filter(i => E.rank[i][S.at]).sort((a, b) => E.rank[a][S.at] - E.rank[b][S.at]);
  return {picks: top.slice(0, 3), focus: top[Math.min(E.kind === "clubs" ? 5 : 24, top.length - 1)], barPilot: null, pin: null, hl: null};
}
// Switch between pilot and club standings; each keeps its own choices
function setStd(v){
  if (v === S.std) return;
  S.saved[S.std] = Object.fromEntries(PER_STD.map(k => [k, S[k]]));
  S.std = v; E = entities();
  Object.assign(S, S.saved[v] || defaultChoices());
  if (v === "clubs" && S.mode === "club") S.mode = "top";
  slotOf.clear(); S.rangeKey = null;
  syncEntityLists();
}
// Point the page at a newly loaded season. Pilots (or clubs) chosen in the previous season are kept where they are
// also in this one (pilots matched by ID, clubs by name); otherwise the defaults apply.
function applySeason(data, prev){
  const keys = prev ? list => list.map(i => i == null ? null : E.key(i)) : null; // E still describes the old season
  const keep = keys ? {picks: keys(S.picks), focus: keys([S.focus])[0], bar: keys([S.barPilot])[0]} : null;
  M = buildModel(data);
  E = entities(); S.saved = {};
  const idx = new Map([...Array(E.n).keys()].map(i => [E.key(i), i]));
  document.title = `UK XC League ${M.season} – standings over time`;
  $("#h1").textContent = `UK XC League ${M.season} — standings through the season`;
  const src = $("#source");
  src.textContent = data.source ? "Data: " + data.source + ". Standings rebuilt from final, moderated flights, so they may differ slightly from the live table on a given day." : "";
  src.hidden = !data.source;
  $("#club").innerHTML = M.clubs.map(c => `<option>${esc(c)}</option>`).join("");
  if (!M.clubs.includes(S.club)) S.club = M.clubs[0] || "";
  $("#club").value = S.club;
  const at = $("#at"); at.min = M.firstDay; at.max = M.lastDay; S.at = M.lastDay; at.value = S.at;
  S.from = M.firstDay; S.to = M.lastDay; S.rangeKey = null;
  for (const id of ["#from", "#to"]){ $(id).min = isoD(M.dates[0]); $(id).max = isoD(M.dates[M.D - 1]); }
  syncRangeInputs();
  slotOf.clear();
  const def = defaultChoices();
  const picks = keep ? keep.picks.map(k => idx.get(k)).filter(i => i != null) : [];
  Object.assign(S, def, {
    picks: picks.length ? picks : def.picks,
    focus: keep && idx.has(keep.focus) ? idx.get(keep.focus) : def.focus,
    barPilot: keep && idx.has(keep.bar) ? idx.get(keep.bar) : null,
  });
  syncEntityLists();
}
let loading = 0;
async function loadSeason(season){
  const ticket = ++loading;
  const file = `data/league-${season}.json`;
  let data;
  try {
    const r = await fetch(file);
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    if (ticket !== loading) return;
    const el = $("#err"); el.hidden = false;
    el.textContent = `Couldn't load ${file} (${e.message}). The page must be opened through a web server rather than as a local file.`;
    if (M) $("#season").value = M.season;
    return;
  }
  if (ticket !== loading) return; // a later choice of season overtook this one
  $("#err").hidden = true;
  applySeason(data, M);
  $("#season").value = M.season;
  update();
}

function setupUI(){
  const at = $("#at");
  $("#season").addEventListener("change", e => loadSeason(e.target.value));

  const segClick = (id, key, after) => $(id).addEventListener("click", e => { const v = e.target.dataset.v; if (v){ S[key] = v; after && after(v); update(); } });
  $("#std").addEventListener("click", e => { const v = e.target.closest("button")?.dataset.v; if (v){ setStd(v); update(); } });
  $("#mode").addEventListener("click", e => {
    const v = e.target.closest("button")?.dataset.v; if (!v) return;
    S.mode = v; S.hl = null; $("#search").value = v === "around" && S.focus != null ? E.label(S.focus) : ""; update();
  });
  segClick("#metric", "metric");
  segClick("#chartType", "chart");
  segClick("#barScale", "barScale");
  segClick("#barFlights", "barFlights");
  $("#n").addEventListener("input", e => { const v = +e.target.value; if (v >= 1){ S.n = Math.min(100, v); update(); } });
  $("#k").addEventListener("input", e => { const v = +e.target.value; if (v >= 1){ S.k = Math.min(30, v); update(); } });
  $("#barPilot").addEventListener("change", e => { S.barPilot = +e.target.value; render(); });
  $("#club").addEventListener("change", e => { S.club = e.target.value; update(); });
  at.addEventListener("input", e => { S.at = +e.target.value; update(); });
  const dayOf = v => Math.round((parseD(v) - M.dates[0]) / DAY);
  $("#from").addEventListener("change", e => { if (!e.target.value) return; S.from = Math.max(0, Math.min(dayOf(e.target.value), S.to - 1)); syncRangeInputs(); update(); });
  $("#to").addEventListener("change", e => { if (!e.target.value) return; S.to = Math.min(M.D - 1, Math.max(dayOf(e.target.value), S.from + 1)); syncRangeInputs(); update(); });
  $("#resetRange").addEventListener("click", () => { S.rangeKey = null; update(); });
  $("#search").addEventListener("change", e => {
    const i = E.byName.get(e.target.value.trim().toLowerCase()); if (i == null) return;
    if (S.mode === "pick"){ if (!S.picks.includes(i)) S.picks.push(i); e.target.value = ""; }
    else S.focus = i;
    update();
  });
  document.addEventListener("click", e => {
    const rm = e.target.closest("[data-rm]");
    if (rm){ const i = +rm.dataset.rm; S.picks = S.picks.filter(p => p !== i); update(); return; }
    const fl = e.target.closest("[data-flights]"); // a club's pilot in the summary above the chart
    if (fl){ showPilotFlights(+fl.dataset.flights); return; }
    const tr = e.target.closest("#rows tr[data-i]");
    if (tr && S.chart === "bar"){ S.barPilot = +tr.dataset.i; render(); }
    else if (tr && S.chart === "line" && !e.target.closest("button")) togglePin(+tr.dataset.i);
  });
  $("#rows").addEventListener("mouseover", e => { if (S.chart !== "line") return; const tr = e.target.closest("tr[data-i]"); setHl(tr ? +tr.dataset.i : null); });
  $("#rows").addEventListener("mouseleave", () => setHl(null));
  const lg = $("#lineLegend");
  lg.addEventListener("mouseover", e => { const b = e.target.closest(".li"); setHl(b ? +b.dataset.i : null); });
  lg.addEventListener("mouseleave", () => setHl(null));
  // a legend entry opens that pilot's (or club's) Breakdown; hovering still picks out the line
  lg.addEventListener("click", e => { const b = e.target.closest(".li"); if (b){ S.barPilot = +b.dataset.i; S.chart = "bar"; S.hl = null; update(); } });
  addEventListener("keydown", e => { if (e.key === "Escape" && S.pin != null){ S.pin = null; applyHighlight(); } });
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 120); });
}
async function init(){
  let seasons;
  try {
    const r = await fetch("data/seasons.json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    seasons = (await r.json()).seasons.map(s => s.season); // newest first
    if (!seasons.length) throw new Error("no seasons listed");
  } catch (e) {
    const el = $("#err"); el.hidden = false;
    el.textContent = "Couldn't load data/seasons.json (" + e.message + "). The page must be opened through a web server rather than as a local file.";
    return;
  }
  $("#season").innerHTML = seasons.map(s => `<option>${esc(s)}</option>`).join("");
  setupUI();
  await loadSeason(seasons[0]);
}
init();
</script>
</body>
</html>
